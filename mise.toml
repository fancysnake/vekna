[settings]
# Sequential execution to avoid race conditions in parallel tests
jobs = 1

[tools]
pipx = "1.16.3"
"pipx:poetry" = "2.4.1"
python = "3.11"

[hooks]
enter = "poetry install"

[env]
# Mise creates and activates this virtualenv automatically
_.python.venv = { path = ".venv", create = true }
PACKAGE = "vekna"
SRC_PATHS = "src"
TEST_PATHS = "tests"
SCRIPT_PATHS = "rituals.py"
TOML_PATHS = ".taplo.toml pyproject.toml mise.toml tingle.toml"

[task_config]
includes = [
    "git::https://github.com/fancysnake/shared-configs.git//python.toml?ref=5da354f89c7e72d677e80326270aa8d8226ee76e",
]

[tasks.update]
run = [{ task = "dep:upgrade:py" }, "pre-commit autoupdate"]

[tasks.fullcheck]
run = [
    "poetry install",
    { task = "format:py" },
    { task = "lint:py" },
    { task = "test:py:cov:diff" },
    { task = "lint:tingle" },
]
