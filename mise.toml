[settings]
# Sequential execution to avoid race conditions in parallel tests
jobs = 8

[tools]
# `node` is here only because markdownlint-cli2 is npm-backed and its shim needs
# one on PATH. `jq` is what `release:bump` edits the plugin manifest with, and
# what hk checks JSON with.
actionlint = "1.7.12"
hk = "2.10.0"
jq = "1.8.2"
markdownlint-cli2 = "0.24.0"
node = "26"
pipx = "1.18.12"
"pipx:poetry" = "2.5.1"
pkl = "0.32.2"
python = "3.11"
# actionlint hands every `run:` script to shellcheck.
shellcheck = "0.11.0"
trivy = "0.76.1"

[hooks]
enter = ["poetry install", "hk install"]

[env]
# Mise creates and activates this virtualenv automatically
_.python.venv = { path = ".venv", create = true }
PACKAGE = "vekna"
SRC_PATHS = "src"
TEST_PATHS = "tests"
SCRIPT_PATHS = ""
TOML_PATHS = ".taplo.toml .vekna.toml pyproject.toml mise.toml tingle.toml"

[task_config]
includes = [
    "git::https://github.com/fancysnake/shared-configs.git//python.toml?ref=20e8c1f42f6e2904cef3fa60ba9c64283e2d7ae8",
]

# The shared dep:upgrade:py, with lint:trivy in place of its `pip-audit .`; an
# included task cannot be overridden by name.
[tasks.update]
run = [
    "mise upgrade --bump --exclude python --minimum-release-age=7d --local",
    "mise install",
    "pip install -U pip",
    "poetry update",
    { task = "lint:deptry" },
    { task = "lint:trivy" },
    "poetry show -o",
]

[tasks."lint:deptry"]
description = "Find declared-but-unused and used-but-undeclared dependencies"
run = "deptry src tests"

# Deliberately not in `fullcheck`. What this reports changes when somebody else
# publishes an advisory, on a day this repository did not change — a gate that
# goes red on its own schedule, and about the development environment rather
# than about what a user installs. `.github/workflows/audit.yml` runs the
# version of the question that matters, weekly, without the dev groups. This
# one is here for asking it by hand. `.venv` is skipped because a git
# dependency installs with its own lockfile, whose pins are not ours, and
# `mutants` because it is mutmut's copy of this tree.
[tasks."lint:trivy"]
description = "Scan the project's lockfiles for known vulnerabilities with Trivy"
run = "trivy fs --scanners vuln --include-dev-deps --skip-dirs .venv --skip-dirs mutants --exit-code 1 --quiet ."

# hk's `check` hook over all files, minus the steps `lint:py` already runs.
# `hk install` (the enter hook) puts the pre-commit hook in place.
[tasks."lint:hk"]
description = "Run the hk linters lint:py does not cover on all files"
run = "hk check --all --skip-step black --skip-step ruff --skip-step taplo"

# `lint:py` comes from the shared config and cannot be appended to from here, so
# `lint:deptry` hangs off `fullcheck` instead — which is the gate that matters.
# It belongs here and `lint:trivy` does not: deptry reads this repository and
# nothing else, so it answers the same on any two days.
[tasks.fullcheck]
run = [
    "poetry install",
    { task = "format:py" },
    { task = "lint:py" },
    { task = "lint:deptry" },
    { task = "lint:hk" },
    { task = "test:py:cov:diff" },
    { task = "lint:tingle" },
]

[tasks.pr-fix]
description = "Pull Request Formatting and Readiness Check"
run = [
    "mise install",
    "poetry install",
    { task = "format:py" },
    { task = "lint:py" },
    { task = "test:py:cov", args = ['-xvv', '--fail-under=100'] },
]

[tasks."site:dev"]
description = "Serve the documentation site with live reload"
run = "poetry install --with docs --quiet && mkdocs serve"

[tasks."site:build"]
description = "Build the documentation site into site/"
run = "poetry install --with docs --quiet && mkdocs build --strict"

# `--strict` is the whole check: it fails the build on a link to a page that is
# not there, which is what rots first when a page is renamed. The other thing
# that rots — the CLI reference drifting from what `vekna --help` prints — is
# guarded by a test instead, because that breaks on a Python change and the
# suite is what runs on those.
[tasks."site:check"]
description = "Build the site and fail on broken internal links"
run = { task = "site:build" }

# The plugin carries the package version, so a bump is two files that must
# agree. `poetry version` is what validates the string; the manifest follows it.
[tasks."release:bump"]
description = "Set the package version in pyproject.toml and the plugin manifest"
usage = 'arg "<version>"'
run = """
set -eu
poetry version "$usage_version"
manifest=plugins/ritual-scribe/.claude-plugin/plugin.json
jq --arg v "$(poetry version -s)" '.version = $v' "$manifest" > "$manifest.tmp"
mv "$manifest.tmp" "$manifest"
git --no-pager diff --stat -- pyproject.toml "$manifest"
"""

# What the tag does, minus the publish: each artifact is built and then
# installed somewhere that has never seen this project, because `poetry install`
# leaves a venv where everything imports whether the artifact carries it or not.
# Both get a venv of their own — the sdist is a different file list built a
# different way, and it is what `pip install` falls back to wherever the wheel
# does not fit.
[tasks."release:build"]
description = "Build the wheel and sdist, then import-check each in a bare venv"
run = """
set -eu
rm -rf dist
poetry build
bare=$(mktemp -d)
trap 'rm -rf "$bare"' EXIT
installs() {
    python -m venv "$1"
    "$1/bin/pip" install --quiet --disable-pip-version-check "$2"
    "$1/bin/python" -c 'import vekna.lexicon, vekna.trial, vekna.wire'
    "$1/bin/vekna" --help > /dev/null
}
installs "$bare/wheel" dist/*.whl
installs "$bare/sdist" dist/*.tar.gz
python -c 'import sys, zipfile; assert "vekna/py.typed" in zipfile.ZipFile(sys.argv[1]).namelist(), "py.typed missing from the wheel"' dist/*.whl
echo "ok: $(ls dist/*.whl dist/*.tar.gz)"
"""

# NOTE: mutmut reuses mutants/ between runs: its stats only re-collect for new
# tests, so a function added since the last run maps to no test, and the
# "no tests" verdict that writes into the .meta files is never reset by a later
# run. Starting from an empty mutants/ makes every run a full one, as in CI;
# "no tests" is gated like a survivor so a stale verdict cannot pass either.
[tasks."test:mutation"]
description = "Run mutation tests; fails on any surviving or untested mutant"
run = [
    "rm -rf mutants",
    "mutmut run",
    "mutmut results",
    "! mutmut results | grep -E ': (survived|no tests)$'",
]
