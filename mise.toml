[settings]
# Sequential execution to avoid race conditions in parallel tests
jobs = 8

[tools]
# Pinned to the same version `.pre-commit-config.yaml` pins, so the hook and the
# task cannot disagree about what passes. `node` is here only because the
# linter is npm-backed and its shim needs one on PATH.
markdownlint-cli2 = "0.23.2"
node = "26"
pipx = "1.16.5"
"pipx:poetry" = "2.4.1"
python = "3.11"

[hooks]
enter = "poetry install"

[env]
# Mise creates and activates this virtualenv automatically
_.python.venv = { path = ".venv", create = true }
PACKAGE = "vekna"
# `rituals` is here, and not only `src`, so the engine's own author-facing
# contract is checked the way an author would check it: the decorators, the
# transitions and the folio calls all go through mypy under the same strict
# config as the package. It is the one package outside `src` that uses vekna
# the way a user does, and drift shows up here before it ships.
SRC_PATHS = "src rituals"
TEST_PATHS = "tests"
SCRIPT_PATHS = ""
TOML_PATHS = ".taplo.toml pyproject.toml mise.toml tingle.toml"

[task_config]
includes = [
    "git::https://github.com/fancysnake/shared-configs.git//python.toml?ref=5da354f89c7e72d677e80326270aa8d8226ee76e",
]

[tasks.update]
run = [{ task = "dep:upgrade:py" }, "pre-commit autoupdate"]

# Globs and rule config live in `.markdownlint-cli2.jsonc`, which pre-commit
# reads too — so there is one answer to "does this markdown pass".
[tasks."lint:markdown"]
description = "Check Markdown files"
run = "markdownlint-cli2"

[tasks.fullcheck]
run = [
    "poetry install",
    { task = "format:py" },
    { task = "lint:py" },
    { task = "lint:markdown" },
    { task = "test:py:cov:diff" },
    { task = "lint:tingle" },
]
