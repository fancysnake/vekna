---
site_name: vekna
site_url: https://vekna.fancysnake.dev
site_description: Run coding agents as rituals — ordinary Python programs whose steps you control.
repo_url: https://github.com/fancysnake/vekna
repo_name: fancysnake/vekna
copyright: BSD-3-Clause

# `docs/` holds the plan as well as the manual — `reborn/` and its siblings are
# written for the author, and read as noise to anyone arriving from PyPI. They
# stay in the repository and out of the build; a second directory tree would buy
# the same thing and cost a second place to look.
exclude_docs: |
  README.md
  releasing.md
  reborn/
  eye/
  hand/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  # Both schemes are defined in `docs/stylesheets/eldritch.css`. No `primary` or
  # `accent` here on purpose: those generate their own rules, and two sources
  # for one colour is one more than the number that can be right.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: eldritch
      toggle: {icon: material/candle, name: Let the candles gutter}
    - media: "(prefers-color-scheme: dark)"
      scheme: eldritch-dark
      toggle: {icon: material/candelabra-fire, name: Light the candles}
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fancysnake/vekna
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vekna/
    - icon: fontawesome/solid/globe
      link: https://fancysnake.dev
      name: fancysnake.dev

extra_css:
  - stylesheets/eldritch.css

markdown_extensions:
  - admonition
  - toc: {permalink: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Start here:
      - index.md
      - rituals.md
      - mediums.md
  - Going further:
      - testing.md
      - examples.md
      - cli.md
  - Before you cast:
      - safety.md
  - Contributing:
      - architecture.md
