# The rituals this project casts on itself. Named here rather than found by
# walking up: `src/rituals/` is where the package lives so that every tool the
# repo runs — mypy, ruff, coverage — picks it up by measuring `src`, and the
# walk-up only ever looks for a `rituals.py` or `rituals/` beside the cwd or
# above it. `files` resolve relative to this file, so a cast started anywhere
# in the repo finds the same source.
[rituals]
files = ["src/rituals"]

# Components that are this repository's answer rather than a run's. A flag
# still wins. `pr_fix` is queued by `ci_watch`, which leaves `remote` unset so
# this table answers it: `origin` is ssh and a cast has no terminal for ssh to
# ask a passphrase on, so the push goes through an https remote with `gh`
# behind it. CLAUDE.md carries the two commands that make it.
[defaults.sweep]
base_branch = "main"

[defaults.pr_fix]
remote = "https-origin"
