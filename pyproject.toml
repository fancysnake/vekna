[project]
name = "vekna"
version = "0.2.0"
description = "Coding agent overseer"
authors = [{ name = "Radosław Ganczarek", email = "radoslaw@ganczarek.in" }]
license = { text = "BSD-3-Clause license" }
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "click (>=8.3.2,<9.0.0)",
    "claude-agent-sdk (>=0.2,<1.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "tomli (>=2.0,<3.0) ; python_version < '3.11'",
]

[project.scripts]
vekna = 'vekna.inits.cli:run'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "codespell (>=2.4.2,<3.0.0)",
    "deptry (>=0.25.1,<0.26.0)",
    "import-linter (>=2.11,<3.0)",
    "mypy (>=2.1.0,<2.2.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "ruff (>=0.15.9,<0.16.0)",
    "vulture (>=2.16,<3.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "diff-cover (>=10.2.0,<11.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
]

# BLACK

[tool.black]
line-length = 88
preview = true
skip-magic-trailing-comma = true
target-version = ['py310']

# DEPTRY

[tool.deptry]
known_first_party = ["vekna"]

# IMPORT LINTER

[tool.importlinter]
include_external_packages = "True"
root_package = "vekna"

# Explanation <source_modules> can't import <forbidden_modules>

[[tool.importlinter.contracts]]
name = "wire"
type = "forbidden"
source_modules = ["vekna.wire"]
forbidden_modules = ["vekna.inits", "vekna.lexicon", "vekna.folio"]


[[tool.importlinter.contracts]]
name = "lexicon"
type = "forbidden"
source_modules = ["vekna.lexicon"]
forbidden_modules = [
    "vekna.inits",
    "vekna.folio.coding",
    "vekna.folio.coding_claude",
]


[[tool.importlinter.contracts]]
name = "folio.flow"
type = "forbidden"
source_modules = ["vekna.folio.flow"]
forbidden_modules = [
    "vekna.inits",
    "vekna.folio.shell",
    "vekna.folio.coding",
    "vekna.folio.coding_claude",
]


[[tool.importlinter.contracts]]
name = "folio.shell"
type = "forbidden"
source_modules = ["vekna.folio.shell"]
forbidden_modules = [
    "vekna.inits",
    "vekna.folio.flow",
    "vekna.folio.coding",
    "vekna.folio.coding_claude",
]


[[tool.importlinter.contracts]]
name = "folio.coding"
type = "forbidden"
source_modules = ["vekna.folio.coding"]
forbidden_modules = [
    "vekna.inits",
    "vekna.folio.flow",
    "vekna.folio.shell",
    "vekna.folio.coding_claude",
]


[[tool.importlinter.contracts]]
name = "folio.coding_claude"
type = "forbidden"
source_modules = ["vekna.folio.coding_claude"]
forbidden_modules = [
    "vekna.inits",
    "vekna.folio.flow",
    "vekna.folio.shell",
    "vekna.folio.coding",
]

# Explanation: within a package, a layer may import the layers below it and
# never the ones above. `_links` and `_mills` share a layer, joined by "|" --
# import-linter's *independent* delimiter, so neither may import the other.
# ":" would place them side by side and let them import freely, which is the
# pair of violations these contracts were added to catch. The reflection
# helpers (_dispatch, _graph, _loader) and the two doors (__init__, entry) are
# deliberately unlisted: they sit across the model rather than in one layer.

[[tool.importlinter.contracts]]
name = "lexicon layers"
type = "layers"
layers = [
    "vekna.lexicon._gates",
    "vekna.lexicon._links | vekna.lexicon._mills",
    "vekna.lexicon._specs",
    "vekna.lexicon._pacts",
]


[[tool.importlinter.contracts]]
name = "wire layers"
type = "layers"
layers = ["vekna.wire._links", "vekna.wire._pacts"]


[[tool.importlinter.contracts]]
name = "folio.shell layers"
type = "layers"
layers = ["vekna.folio.shell._links", "vekna.folio.shell._pacts"]


[[tool.importlinter.contracts]]
name = "folio.coding layers"
type = "layers"
layers = [
    "vekna.folio.coding._inits",
    "vekna.folio.coding._mills",
    "vekna.folio.coding._pacts",
]


[[tool.importlinter.contracts]]
name = "folio.coding_claude layers"
type = "layers"
layers = [
    "vekna.folio.coding_claude._inits",
    "vekna.folio.coding_claude._links",
    "vekna.folio.coding_claude._pacts",
]

# MYPY

[tool.mypy]
check_untyped_defs = true
color_output = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = []
explicit_package_bases = true
extra_checks = true
implicit_reexport = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
pretty = true
python_version = "3.10"
strict = true
strict_equality = true
strict_equality_for_none = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

# vekna.lexicon._dispatch is the reflection boundary and nothing else: it reads
# runtime annotations and invokes heterogeneously-typed steps uniformly, which
# cannot be expressed under disallow_any_expr/explicit. The AST reader (_graph)
# and the file/TOML loaders (_loader) used to share this exemption for free;
# they are strict now.
[[tool.mypy.overrides]]
module = "vekna.lexicon._dispatch"
disallow_any_expr = false
disallow_any_explicit = false
warn_return_any = false

# vekna.lexicon._loader is the dynamic-loading boundary: importlib's
# exec_module, vars(module) and tomllib.load all hand back dict[str, Any] by
# nature. Narrower than the exemption it was carved out of -- the AST reader
# it used to sit beside (_graph) is strict.
[[tool.mypy.overrides]]
module = "vekna.lexicon._loader"
disallow_any_expr = false

# RUFF

[tool.ruff]
fix = false
line-length = 88
output-format = 'concise'
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Trailing comma missing
    "CPY",    # Missing copyright notice at top of file
    "D1",     # Missing docstring
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "ANN",     # flake8-annotations
    "PLC2701", # Private name import
    "S",
]

# VULTURE

[tool.vulture]
exclude = []
min_confidence = 61

# COVERAGE

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/vekna/edges/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "# pragma: no cover"]
precision = 2

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
