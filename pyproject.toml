    "vekna.trial._inits",
    "vekna.trial._specs",
    "vekna.trial._edges",
]

[[tool.importlinter.contracts]]
name = "trial-mills"
type = "forbidden"
source_modules = ["vekna.trial._mills"]
forbidden_modules = [
    "vekna.trial._gates",
    "vekna.trial._links",
    "vekna.trial._inits",
    "vekna.trial._edges",
]

[[tool.importlinter.contracts]]
name = "trial-pacts"
type = "forbidden"
source_modules = ["vekna.trial._pacts"]
forbidden_modules = [
    "vekna.trial._gates",
    "vekna.trial._links",
    "vekna.trial._inits",
    "vekna.trial._mills",
    "vekna.trial._specs",
    "vekna.trial._edges",
]

# The one-way door. `vekna.trial` reaches into the lexicon's internals —
# `Grimoire`, `run_cast`, the rite contextvar — because a test harness has to
# drive a cast, and it is one module in one wheel versioned with the lexicon.
# Nothing may reach back: a rituals.py that could import the trial would have a
# route to the cast runtime, which is the thing that must not happen.
[[tool.importlinter.contracts]]
name = "nothing-imports-trial"
type = "forbidden"
source_modules = [
    "vekna.lexicon",
    "vekna.folio",
    "vekna.wire",
    "vekna.gates",
    "vekna.links",
    "vekna.inits",
    "vekna.mills",
    "vekna.pacts",
    "vekna.specs",
    "vekna.edges",
]
forbidden_modules = ["vekna.trial"]

# MYPY

[tool.mypy]
check_untyped_defs = true
color_output = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = []
explicit_package_bases = true
extra_checks = true
implicit_reexport = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
pretty = true
python_version = "3.11"
strict = true
strict_equality = true
strict_equality_for_none = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = "vekna.folio.coding_claude._links"
disallow_any_expr = false
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "vekna.lexicon._mills._annotations"
disallow_any_expr = false
disallow_any_explicit = false

# Pydantic's own error report is a list of TypedDicts whose values are `Any`.
# Reading it is how `CodingOpts` turns a refusal into a sentence, and a `pacts`
# module may import no internal layer, so the boundary lives here rather than
# in an adapter beside it.
[[tool.mypy.overrides]]
module = "vekna.folio.coding._pacts"
disallow_any_expr = false

# RUFF

[tool.ruff]
line-length = 88
output-format = 'concise'
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Trailing comma missing
    "CPY",     # Missing copyright notice at top of file
    "D1",      # Missing docstring
    "PLC2701", # Private name import
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "ANN", # flake8-annotations
    "S",
]
"src/vekna/lexicon/_mills/_annotations.py" = ["any-type"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# VULTURE

[tool.vulture]
exclude = []
min_confidence = 61

# COVERAGE

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/vekna/edges/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "# pragma: no cover"]
precision = 2
