---
name: Audit

# A new advisory is news, not a broken build. It arrives on somebody else's
# schedule, so it is asked for on ours — weekly, away from the merge path,
# where a failure means "go and look" rather than "your change is wrong".
#
# The question is asked of what a user installs: the locked dependencies of the
# package and its `trial` extra, without the dev groups, which are full of
# tooling that never reaches anyone. `lint:trivy` asks it of those too.
"on":
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834  # v5
        with:
          install_args: trivy
      - name: Audit what an install brings with it
        run: >-
          mise exec -- trivy fs --scanners vuln --exit-code 1 --quiet poetry.lock
        env:
          # `mise exec` installs every tool in mise.toml first by default,
          # which would undo `install_args`
          MISE_EXEC_AUTO_INSTALL: "false"
