---
name: Markdown

# A workflow of its own, because `ci.yml` ignores `docs/**` — a docs-only pull
# request runs none of it, which is exactly the pull request this check is for.
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/markdown.yml"

  push:
    branches: ["main"]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/markdown.yml"

concurrency:
  group: markdown-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise install markdownlint-cli2 node
      - run: mise run lint:markdown
