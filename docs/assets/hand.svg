<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1480" width="1400" height="1480" role="img" aria-labelledby="t d">
  <title id="t">Hand: vekna works while you are away</title>
  <desc id="d">The operator steers from Discord. The vekna daemon runs vigils that poll landschaft's inbox and issue board, and casts cabinet's rituals: heal.mine and heal.main for the inbox, fabricate and fabricate.epic for the board, each plan approved through an approval gate. Worktrees are leased per step, and everything holds while Claude's usage limit is hit.</desc>
  <style>
    :root {
      --bg: #f3efe7; --card: #fbf8f3; --ink: #1f241b; --soft: #4b5147; --faint: #767e70;
      --line: #c9cfbf; --moss: #3b4a2a; --sigil: #4a6127; --verd: #12715a; --verd-bg: #dcebe4;
      --ox: #8c2230; --ox-bg: #f3dde0; --tint: #e6eadf;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161a13; --card: #1f241b; --ink: #e8e4da; --soft: #b8bcae; --faint: #8b9183;
        --line: #3c4534; --moss: #a7bd86; --sigil: #b6cc8d; --verd: #5cc6a6; --verd-bg: #173329;
        --ox: #e58a96; --ox-bg: #3a1c21; --tint: #262c21;
      }
    }
    text { font-family: "Inter", "Segoe UI", system-ui, sans-serif; fill: var(--ink); }
    .mono { font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace; }
    .h1 { font-size: 36px; font-weight: 700; fill: var(--moss); letter-spacing: .5px; }
    .lede { font-size: 16px; fill: var(--soft); }
    .sec { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: var(--sigil); }
    .h3 { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; fill: var(--ink); }
    .s { font-size: 12px; fill: var(--soft); }
    .xs { font-size: 11px; fill: var(--faint); }
    .code { font-size: 12px; fill: var(--verd); }
    .warn { fill: var(--ox); }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
    .tint { fill: var(--tint); stroke: var(--line); stroke-width: 1; }
    .daemon { fill: var(--card); stroke: var(--moss); stroke-width: 2.2; }
    .hot { fill: var(--verd-bg); stroke: var(--verd); stroke-width: 1.4; }
    .bad { fill: var(--ox-bg); stroke: var(--ox); stroke-width: 1.4; }
    .arrow { fill: none; stroke: var(--soft); stroke-width: 1.6; marker-end: url(#a); }
    .arrow-v { fill: none; stroke: var(--verd); stroke-width: 1.8; marker-end: url(#av); }
    .arrow-x { fill: none; stroke: var(--ox); stroke-width: 1.6; marker-end: url(#ax); }
    .dash { stroke-dasharray: 5 4; }
    .lane { stroke: var(--line); stroke-width: 1; }
    .bar { fill: var(--verd); }
    .bar-wait { fill: none; stroke: var(--verd); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .bar-hold { fill: var(--ox-bg); stroke: var(--ox); stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--soft)"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--verd)"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--ox)"/></marker>
  </defs>

  <rect class="bg" width="1400" height="1480"/>

  <!-- ============ HEADER ============ -->
  <text x="40" y="62" class="h1">Hand · vekna works while you are away</text>
  <text x="40" y="94" class="lede">Start vekna and leave. Vigils poll landschaft, cabinet's rituals heal pull requests and fabricate new ones,</text>
  <text x="40" y="116" class="lede">and every question, plan and approval reaches the operator on Discord. Every cast stays attended.</text>

  <!-- ============ 1 · WHO TALKS TO WHOM ============ -->
  <text x="40" y="170" class="sec">1 · WHO TALKS TO WHOM</text>

  <!-- operator -->
  <g transform="translate(40,186)">
    <rect width="380" height="200" rx="10" class="card"/>
    <text x="20" y="30" class="h3">Operator, away from the desk</text>
    <text x="20" y="58" class="b">Discord: a channel per project,</text>
    <text x="20" y="76" class="b">a thread per cast  <tspan class="code mono">#260</tspan></text>
    <text x="20" y="104" class="b">discusses each plan until approved  <tspan class="code mono">#266</tspan></text>
    <text x="20" y="132" class="b">cast · cancel <tspan class="code mono">#243</tspan> · status <tspan class="code mono">#105</tspan></text>
    <text x="20" y="160" class="b">pause a vigil or one project  <tspan class="code mono">#263</tspan></text>
    <text x="20" y="186" class="xs">only allowlisted users are heard</text>
  </g>

  <!-- daemon -->
  <g transform="translate(510,186)">
    <rect width="380" height="200" rx="10" class="daemon"/>
    <text x="20" y="30" class="h3">vekna daemon</text>
    <text x="20" y="58" class="b">a user service, back after a crash  <tspan class="code mono">#265</tspan></text>
    <text x="20" y="86" class="b">vigils poll their source  <tspan class="code mono">#263</tspan></text>
    <text x="20" y="114" class="b">a circle per project: queue, slots, trees</text>
    <text x="20" y="142" class="b">repository → checkout map, global  <tspan class="code mono">#267</tspan></text>
    <text x="20" y="170" class="b">holds all work on a usage limit  <tspan class="code mono">#261</tspan></text>
    <text x="20" y="188" class="xs">binds only its Unix socket</text>
  </g>

  <!-- landschaft -->
  <g transform="translate(980,186)">
    <rect width="380" height="200" rx="10" class="card"/>
    <text x="20" y="30" class="h3">landschaft · local JSON API</text>
    <text x="20" y="58" class="b">inbox: which repos have work,</text>
    <text x="20" y="76" class="b">group by group</text>
    <text x="20" y="104" class="b">issue board: the next task by rule  <tspan class="code mono">landschaft#62</tspan></text>
    <text x="20" y="132" class="b">claims per vigil, apart from yours  <tspan class="code mono">landschaft#151</tspan></text>
    <text x="20" y="160" class="b">reset once every repo had a turn</text>
    <text x="20" y="188" class="xs">never writes to GitHub</text>
  </g>

  <!-- arrows row 1 -->
  <path d="M424,270 L506,270" class="arrow-v"/>
  <path d="M506,302 L424,302" class="arrow-v"/>
  <text x="430" y="262" class="xs">answers</text>
  <text x="430" y="320" class="xs">questions</text>
  <path d="M894,270 L976,270" class="arrow"/>
  <path d="M976,302 L894,302" class="arrow"/>
  <text x="904" y="262" class="xs">poll, claim</text>
  <text x="904" y="320" class="xs">work</text>

  <!-- ============ 2 · WHAT A POLL CASTS ============ -->
  <text x="40" y="440" class="sec">2 · WHAT A POLL CASTS</text>

  <!-- lane A: inbox -->
  <g transform="translate(40,456)">
    <rect width="1320" height="230" rx="10" class="card"/>
    <text x="20" y="28" class="h3">Inbox → heal</text>
    <text x="210" y="28" class="s">one cast per project and ritual, skipped while one is queued or running</text>

    <text x="20" y="56" class="xs">INBOX GROUP</text>
    <text x="250" y="56" class="xs">RITUAL, IN THAT PROJECT</text>
    <text x="580" y="56" class="xs">WHAT IT DOES</text>

    <g transform="translate(20,66)">
      <rect width="190" height="34" rx="6" class="tint"/>
      <text x="14" y="22" class="b">Heal</text>
      <path d="M194,17 L226,17" class="arrow"/>
      <rect x="230" width="290" height="34" rx="6" class="hot"/>
      <text x="244" y="22" class="b mono">heal.mine → heal.pr</text>
      <path d="M524,17 L556,17" class="arrow"/>
      <text x="560" y="14" class="b">merge, fix CI, answer threads, review, push</text>
      <text x="560" y="30" class="s">a tree only while a step changes the branch  <tspan class="code mono">cabinet#138</tspan></text>
    </g>

    <g transform="translate(20,110)">
      <rect width="190" height="34" rx="6" class="tint"/>
      <text x="14" y="22" class="b">Failing job on main</text>
      <path d="M194,17 L226,17" class="arrow"/>
      <rect x="230" width="290" height="34" rx="6" class="hot"/>
      <text x="244" y="22" class="b mono">heal.main</text>
      <text x="340" y="22" class="code mono">cabinet#135</text>
      <path d="M524,17 L556,17" class="arrow"/>
      <text x="560" y="22" class="b">branch from main, fix, open a pull request; never pushes to main</text>
    </g>

    <g transform="translate(20,154)">
      <rect width="190" height="34" rx="6" class="tint"/>
      <text x="14" y="22" class="b">Identify</text>
      <path d="M194,17 L226,17" class="arrow"/>
      <rect x="230" width="290" height="34" rx="6" class="hot"/>
      <text x="244" y="22" class="b mono">identify</text>
      <path d="M524,17 L556,17" class="arrow"/>
      <text x="560" y="22" class="b">type and size new issues, so the board can rank them</text>
    </g>

    <g transform="translate(20,198)">
      <rect width="190" height="24" rx="6" class="bad"/>
      <text x="14" y="17" class="b warn">Ready</text>
      <path d="M194,12 L226,12" class="arrow-x"/>
      <text x="232" y="17" class="b warn">no ritual: the operator merges</text>
    </g>
  </g>

  <!-- lane B: board -->
  <g transform="translate(40,706)">
    <rect width="1320" height="300" rx="10" class="card"/>
    <text x="20" y="28" class="h3">Issue board → fabricate</text>
    <text x="250" y="28" class="s">one task per poll, from a repository the vigil has not claimed yet</text>

    <g transform="translate(20,46)">
      <rect width="400" height="76" rx="6" class="tint"/>
      <text x="14" y="22" class="b">next task  <tspan class="code mono">landschaft#62</tspan></text>
      <text x="14" y="42" class="s">column with the fewest closed issues → lane Epics, L, M, S</text>
      <text x="14" y="60" class="s">→ oldest first; blocked issues and claimed repos skipped</text>
    </g>
    <path d="M424,84 L466,84" class="arrow"/>
    <g transform="translate(470,62)">
      <rect width="200" height="44" rx="6" class="tint"/>
      <text x="14" y="20" class="b">claim the repository</text>
      <text x="14" y="36" class="code mono">landschaft#151</text>
    </g>

    <!-- split -->
    <path d="M674,74 C720,74 720,154 760,154" class="arrow"/>
    <path d="M674,94 C700,94 700,234 760,234" class="arrow"/>
    <text x="702" y="144" class="xs">epic</text>
    <text x="702" y="226" class="xs">issue</text>

    <!-- epic branch -->
    <g transform="translate(764,134)">
      <rect width="536" height="56" rx="6" class="hot"/>
      <text x="14" y="22" class="b"><tspan class="mono">fabricate.epic</tspan>  <tspan class="code mono">cabinet#137</tspan></text>
      <text x="14" y="42" class="s">agent proposes the next step: a sub-issue or a related one → approval gate</text>
      <path d="M268,56 L268,78" class="arrow-v dash"/>
      <text x="276" y="72" class="xs">queues fabricate in the issue's own project  <tspan class="code mono">#267</tspan></text>
    </g>

    <!-- fabricate chain -->
    <g transform="translate(764,216)">
      <rect width="536" height="70" rx="6" class="hot"/>
      <text x="14" y="22" class="b"><tspan class="mono">fabricate</tspan>  <tspan class="code mono">cabinet#136</tspan></text>
      <text x="14" y="42" class="s">plan → approval gate <tspan class="code mono">#266</tspan> → build in a leased tree <tspan class="code mono">#264</tspan></text>
      <text x="14" y="60" class="s">→ gate green → push → open a pull request that closes the issue</text>
    </g>

    <text x="20" y="156" class="s">The approval gate is a discussion, not a button:</text>
    <text x="20" y="176" class="s">each reply goes back to the agent, which answers or revises,</text>
    <text x="20" y="196" class="s">until the operator approves — or rejects, and the cast ends.</text>
    <text x="20" y="228" class="s">Approval is the operator's explicit word, never the agent's guess.</text>
  </g>

  <!-- ============ 3 · WHAT A CAST HOLDS ============ -->
  <text x="40" y="1060" class="sec">3 · WHAT A CAST HOLDS</text>

  <g transform="translate(40,1076)">
    <rect width="860" height="200" rx="10" class="card"/>
    <text x="20" y="28" class="h3">A fabricate cast over time</text>
    <text x="20" y="48" class="s">a worktree is leased for the step that needs one and given back when it ends  <tspan class="code mono">#264</tspan></text>

    <text x="20" y="88" class="xs">STEP</text>
    <text x="160" y="88" class="s">plan</text>
    <text x="290" y="88" class="s">approval gate, on Discord</text>
    <text x="560" y="88" class="s">build</text>
    <text x="750" y="88" class="s">PR</text>

    <g transform="translate(20,108)">
      <line x1="0" y1="6" x2="820" y2="6" class="lane"/>
      <text y="16" class="xs">PROCESS SLOT</text>
      <rect x="140" width="660" height="14" rx="3" class="bar"/>
    </g>

    <g transform="translate(20,154)">
      <line x1="0" y1="6" x2="820" y2="6" class="lane"/>
      <text y="16" class="xs">WORKTREE</text>
      <rect x="140" width="120" height="14" rx="3" class="bar-wait"/>
      <rect x="270" width="260" height="14" rx="3" class="bar-wait"/>
      <rect x="540" width="180" height="14" rx="3" class="bar"/>
      <rect x="730" width="70" height="14" rx="3" class="bar-wait"/>
      <text x="320" y="36" class="xs">no tree held while the operator thinks</text>
    </g>
  </g>

  <g transform="translate(940,1076)">
    <rect width="420" height="200" rx="10" class="card"/>
    <text x="20" y="28" class="h3">Usage limit  <tspan class="code mono">#261</tspan></text>
    <text x="20" y="54" class="b">limit hit → nothing new starts,</text>
    <text x="20" y="72" class="b">a cast at an agent call waits, not fails</text>
    <text x="20" y="100" class="b">reset → work resumes in order</text>
    <rect x="20" y="124" width="110" height="14" rx="3" class="bar"/>
    <rect x="136" y="124" width="150" height="14" rx="3" class="bar-hold"/>
    <rect x="292" y="124" width="108" height="14" rx="3" class="bar"/>
    <text x="154" y="160" class="xs warn">holding until reset</text>
    <text x="20" y="184" class="xs">no token budgets, no switching models</text>
  </g>

  <!-- ============ 4 · THE LOOP ============ -->
  <text x="40" y="1330" class="sec">4 · THE LOOP</text>

  <g transform="translate(40,1346)">
    <rect width="170" height="44" rx="6" class="tint"/>
    <text x="14" y="27" class="b">issue on the board</text>
    <path d="M174,22 L196,22" class="arrow"/>
    <rect x="200" width="150" height="44" rx="6" class="hot"/>
    <text x="214" y="27" class="b mono">fabricate</text>
    <path d="M354,22 L376,22" class="arrow"/>
    <rect x="380" width="170" height="44" rx="6" class="tint"/>
    <text x="394" y="27" class="b">pull request</text>
    <path d="M554,22 L576,22" class="arrow"/>
    <rect x="580" width="170" height="44" rx="6" class="tint"/>
    <text x="594" y="27" class="b">inbox · Heal</text>
    <path d="M754,22 L776,22" class="arrow"/>
    <rect x="780" width="150" height="44" rx="6" class="hot"/>
    <text x="794" y="27" class="b mono">heal.mine</text>
    <path d="M934,22 L956,22" class="arrow"/>
    <rect x="960" width="150" height="44" rx="6" class="bad"/>
    <text x="974" y="27" class="b warn">Ready · merged</text>
    <path d="M1114,22 L1136,22" class="arrow"/>
    <rect x="1140" width="180" height="44" rx="6" class="tint"/>
    <text x="1154" y="27" class="b">issue closed</text>

    <path d="M1230,48 L1230,78 L85,78 L85,48" class="arrow dash"/>
    <text x="360" y="98" class="xs">a column with more closed issues is picked later, so every category and every repository gets its turn</text>
  </g>

  <text x="40" y="1468" class="xs">Epic fancysnake/vekna#259 · bare numbers are vekna issues</text>
</svg>
