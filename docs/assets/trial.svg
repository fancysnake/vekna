<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1130" width="1400" height="1130" role="img" aria-labelledby="t d">
  <title id="t">Testing a ritual with vekna.trial</title>
  <desc id="d">vekna.trial runs a ritual with doubles at the folio outer edge: the mediums still run, each call is answered from a script by glob then queue, nothing defaults, and the recordings are what a test asserts on.</desc>
  <style>
    :root {
      --bg: #f3efe7; --card: #fbf8f3; --ink: #1f241b; --soft: #4b5147; --faint: #767e70;
      --line: #c9cfbf; --moss: #3b4a2a; --sigil: #4a6127; --verd: #12715a; --verd-bg: #dcebe4;
      --ox: #8c2230; --ox-bg: #f3dde0; --tint: #e6eadf;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161a13; --card: #1f241b; --ink: #e8e4da; --soft: #b8bcae; --faint: #8b9183;
        --line: #3c4534; --moss: #a7bd86; --sigil: #b6cc8d; --verd: #5cc6a6; --verd-bg: #173329;
        --ox: #e58a96; --ox-bg: #3a1c21; --tint: #262c21;
      }
    }
    text { font-family: "Inter", "Segoe UI", system-ui, sans-serif; fill: var(--ink); }
    .mono { font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace; }
    .h1 { font-size: 36px; font-weight: 700; fill: var(--moss); letter-spacing: .5px; }
    .lede { font-size: 16px; fill: var(--soft); }
    .sec { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: var(--sigil); }
    .h3 { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; fill: var(--ink); }
    .s { font-size: 12px; fill: var(--soft); }
    .xs { font-size: 11px; fill: var(--faint); }
    .code { font-size: 12px; fill: var(--verd); }
    .ok { fill: var(--verd); font-weight: 700; }
    .warn { fill: var(--ox); }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
    .tint { fill: var(--tint); stroke: var(--line); stroke-width: 1; }
    .daemon { fill: none; stroke: var(--moss); stroke-width: 2.2; }
    .circle { fill: var(--tint); stroke: var(--sigil); stroke-width: 1.6; stroke-dasharray: 7 5; }
    .hot { fill: var(--verd-bg); stroke: var(--verd); stroke-width: 1.4; }
    .bad { fill: var(--ox-bg); stroke: var(--ox); stroke-width: 1.4; }
    .arrow { fill: none; stroke: var(--soft); stroke-width: 1.6; marker-end: url(#a); }
    .arrow-v { fill: none; stroke: var(--verd); stroke-width: 1.8; marker-end: url(#av); }
    .arrow-x { fill: none; stroke: var(--ox); stroke-width: 1.6; marker-end: url(#ax); }
    .dash { stroke-dasharray: 5 4; }
    .slot-on { fill: var(--verd); }
    .slot-off { fill: none; stroke: var(--verd); stroke-width: 1.6; }
    .lane { stroke: var(--line); stroke-width: 1; }
    .bar { fill: var(--verd); }
    .bar-wait { fill: none; stroke: var(--verd); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .bar-q { fill: var(--line); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--soft)"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--verd)"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--ox)"/></marker>
    <g id="tree"><path d="M0,-11 L8,2 L3,2 L3,9 L-3,9 L-3,2 L-8,2 z"/></g>
  </defs>
  <rect class="bg" width="1400" height="1130"/>

  <text x="40" y="62" class="h1">Testing a ritual with vekna.trial</text>
  <text x="40" y="94" class="lede">A ritual runs with every medium answering from a script: no agent call, no wall time.</text>
  <text x="40" y="116" class="lede"><tspan class="mono" style="fill: var(--verd)">pip install 'vekna[trial]'</tspan> brings a <tspan class="mono" style="fill: var(--verd)">trial</tspan> pytest fixture.</text>

  <text x="40" y="170" class="sec">WHERE THE DOUBLES STAND</text>

  <!-- test -->
  <g transform="translate(40,230)">
    <rect class="hot" width="200" height="200" rx="12"/>
    <text x="20" y="34" class="h3">your test</text>
    <text x="20" y="62" class="s">scripts the answers,</text>
    <text x="20" y="80" class="s">runs a step or a cast,</text>
    <text x="20" y="98" class="s">asserts on what the</text>
    <text x="20" y="116" class="s">doubles recorded</text>
    <text x="20" y="150" class="code mono">trial.walk(…)</text>
    <text x="20" y="172" class="code mono">trial.cast(…)</text>
  </g>
  <path class="arrow" d="M240,330 L278,330"/>

  <!-- steps -->
  <g transform="translate(280,230)">
    <rect class="card" width="220" height="200" rx="12"/>
    <text x="20" y="34" class="h3">the ritual's steps</text>
    <text x="20" y="62" class="s">your code, unchanged:</text>
    <text x="20" y="80" class="s">branches, loops, budgets,</text>
    <text x="20" y="98" class="s">failure routing</text>
    <rect class="tint" x="20" y="120" width="180" height="60" rx="8"/>
    <text x="34" y="144" class="code mono">shell(…) · enqueue(…)</text>
    <text x="34" y="164" class="code mono">coding(…) · decide(…)</text>
  </g>
  <path class="arrow" d="M500,330 L538,330"/>

  <!-- mediums -->
  <g transform="translate(540,230)">
    <rect class="card" width="280" height="200" rx="12"/>
    <text x="20" y="34" class="h3">the mediums' own bodies</text>
    <text x="20" y="56" class="s">still run, so they are tested too:</text>
    <text x="20" y="86" class="b">• session threading</text>
    <text x="20" y="108" class="b">• resume resolution</text>
    <text x="20" y="130" class="b">• output-schema validation</text>
    <text x="20" y="152" class="b">• exit-code handling</text>
    <text x="20" y="182" class="xs">a wrong Session.CONTINUE fails its test</text>
  </g>
  <path class="arrow" d="M820,330 L878,330"/>

  <!-- the edge -->
  <line x1="850" y1="200" x2="850" y2="450" style="stroke: var(--verd); stroke-width: 2; stroke-dasharray: 6 5"/>
  <text x="842" y="448" class="xs" text-anchor="end" style="fill: var(--verd)">the folio&apos;s outer edge</text>

  <!-- doubles -->
  <g transform="translate(880,210)">
    <rect class="hot" width="230" height="54" rx="10"/>
    <text x="16" y="22" class="b" font-weight="700">shell double</text>
    <text x="16" y="42" class="xs">exit code, stdout, stderr</text>
    <rect class="hot" y="62" width="230" height="54" rx="10"/>
    <text x="16" y="84" class="b" font-weight="700">coding double</text>
    <text x="16" y="104" class="xs">the agent's reply, tools, questions</text>
    <rect class="hot" y="124" width="230" height="54" rx="10"/>
    <text x="16" y="146" class="b" font-weight="700">decide double</text>
    <text x="16" y="166" class="xs">the operator's answer</text>
    <rect class="hot" y="186" width="230" height="54" rx="10"/>
    <text x="16" y="208" class="b" font-weight="700">queue double</text>
    <text x="16" y="228" class="xs">a queued cast's result</text>
  </g>
  <path class="arrow-x dash" d="M1110,330 L1148,330"/>

  <!-- world -->
  <g transform="translate(1150,210)">
    <rect class="bad" width="210" height="240" rx="12"/>
    <text x="20" y="34" class="h3 warn">the world</text>
    <text x="20" y="66" class="b warn" text-decoration="line-through">real bash</text>
    <text x="20" y="92" class="b warn" text-decoration="line-through">a live agent</text>
    <text x="20" y="118" class="b warn" text-decoration="line-through">you at a prompt</text>
    <text x="20" y="144" class="b warn" text-decoration="line-through">the daemon's queue</text>
    <text x="20" y="190" class="s warn">never reached from</text>
    <text x="20" y="208" class="s warn">inside a trial</text>
  </g>

  <!-- script / recordings loops -->
  <path class="arrow-v" d="M140,228 C140,190 400,190 878,232"/>
  <text x="420" y="196" class="xs" style="fill: var(--verd)">the script: answers, matched per call</text>
  <path class="arrow" d="M995,452 C995,520 140,520 140,434"/>
  <text x="420" y="514" class="xs">the recordings: every call, as the medium built it</text>

  <!-- ============ MECHANISMS ============ -->
  <text x="40" y="580" class="sec">THE MECHANISMS</text>

  <!-- Panel 1: two ways in -->
  <g transform="translate(40,600)">
    <rect class="card" width="420" height="330" rx="14"/>
    <text x="22" y="34" class="h3">Two ways in</text>

    <rect class="tint" x="22" y="54" width="376" height="104" rx="8"/>
    <text x="36" y="80" class="code mono">trial.walk(step, payload)</text>
    <text x="36" y="104" class="b">one step, no ritual required</text>
    <text x="36" y="126" class="s">hands back its transition: the next</text>
    <text x="36" y="144" class="s">payload, or Done(result)</text>

    <rect class="tint" x="22" y="172" width="376" height="104" rx="8"/>
    <text x="36" y="198" class="code mono">trial.cast(ritual, components)</text>
    <text x="36" y="222" class="b">the whole ritual, across steps</text>
    <text x="36" y="244" class="s">returns the result model;</text>
    <text x="36" y="262" class="s"><tspan class="mono" style="fill: var(--verd)">trial.steps</tspan> says which ran, in order</text>

    <text x="22" y="304" class="xs"><tspan class="mono">walk_async</tspan> · <tspan class="mono">cast_async</tspan> for a suite already in an event loop</text>
  </g>

  <!-- Panel 2: how a call finds its answer -->
  <g transform="translate(490,600)">
    <rect class="card" width="420" height="330" rx="14"/>
    <text x="22" y="34" class="h3">How a call finds its answer</text>

    <rect class="tint" x="22" y="54" width="376" height="40" rx="8"/>
    <text x="210" y="79" class="b" text-anchor="middle">a call arrives at its double</text>
    <path class="arrow" d="M210,94 L210,110"/>
    <rect class="hot" x="22" y="112" width="376" height="52" rx="8"/>
    <text x="36" y="134" class="b" font-weight="700">1 · a glob claims it</text>
    <text x="36" y="153" class="xs">by command for shell, prompt for coding and decide, ritual for queue</text>
    <path class="arrow" d="M210,164 L210,180"/>
    <rect class="hot" x="22" y="182" width="376" height="52" rx="8"/>
    <text x="36" y="204" class="b" font-weight="700">2 · else the ordered queue</text>
    <text x="36" y="223" class="xs">used up as it answers; <tspan class="mono">always=True</tspan> keeps one standing</text>
    <path class="arrow-x" d="M210,234 L210,250"/>
    <rect class="bad" x="22" y="252" width="376" height="52" rx="8"/>
    <text x="36" y="274" class="b warn" font-weight="700">3 · nothing left: TrialScriptError</text>
    <text x="36" y="293" class="xs warn">naming the call and what the script still held</text>
    <text x="22" y="322" class="xs">nothing defaults: an invented exit 0 would test a branch nobody wrote</text>
  </g>

  <!-- Panel 3: assert on the recording -->
  <g transform="translate(940,600)">
    <rect class="card" width="420" height="330" rx="14"/>
    <text x="22" y="34" class="h3">Assert on what was recorded</text>
    <text x="22" y="56" class="s">no assert_called_with: the recording is the surface</text>

    <rect class="tint" x="22" y="74" width="180" height="160" rx="8"/>
    <text x="36" y="94" class="xs">the doubles</text>
    <text x="36" y="114" class="code mono">shell.commands</text>
    <text x="36" y="131" class="code mono">coding.prompts</text>
    <text x="36" y="148" class="code mono">coding.gated</text>
    <text x="36" y="165" class="code mono">coding.calls</text>
    <text x="36" y="182" class="code mono">decide.prompts</text>
    <text x="36" y="199" class="code mono">queue.enqueued</text>
    <text x="36" y="216" class="code mono">queue.rituals</text>

    <rect class="tint" x="218" y="74" width="180" height="160" rx="8"/>
    <text x="232" y="98" class="xs">the cast</text>
    <text x="232" y="122" class="code mono">trial.steps</text>
    <text x="232" y="144" class="code mono">trial.deltas</text>
    <text x="232" y="166" class="code mono">trial.events</text>

    <text x="22" y="254" class="s"><tspan class="mono" style="fill: var(--verd)">coding.calls[1].resume</tspan> proves the second</text>
    <text x="22" y="272" class="s">call joined the first one's thread</text>
    <text x="22" y="296" class="s">a decide answer not among the options</text>
    <text x="22" y="314" class="s">offered raises before the ritual sees it</text>
  </g>

  <!-- ============ GOTCHAS ============ -->
  <text x="40" y="980" class="sec">WHAT WILL CATCH YOU OUT</text>
  <g transform="translate(40,1000)">
    <rect class="card" width="420" height="100" rx="14"/>
    <text x="22" y="32" class="h3">A tool gate is a decide</text>
    <text x="22" y="58" class="s"><tspan class="mono" style="fill: var(--verd)">allow tool 'Bash'?</tspan> arrives at trial.decide,</text>
    <text x="22" y="78" class="s">not at trial.coding: one channel builds both</text>
  </g>
  <g transform="translate(490,1000)">
    <rect class="bad" width="420" height="100" rx="14"/>
    <text x="22" y="32" class="h3 warn">Only inside its with-block</text>
    <text x="22" y="58" class="s warn">outside it, cast and walk raise TrialError</text>
    <text x="22" y="78" class="s warn">rather than fall through to real bash</text>
  </g>
  <g transform="translate(940,1000)">
    <rect class="card" width="420" height="100" rx="14"/>
    <text x="22" y="32" class="h3">Calls in one TaskGroup</text>
    <text x="22" y="58" class="s">arrive in whichever order the scheduler picks;</text>
    <text x="22" y="78" class="s">errors come wrapped in BaseExceptionGroup</text>
  </g>
</svg>
